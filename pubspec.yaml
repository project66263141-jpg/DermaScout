name: dermascout
description: "DermaScout - Offline-first ultra-small skin disease screening Flutter application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  image: ^4.9.2
  camera: ^0.11.2+1
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
